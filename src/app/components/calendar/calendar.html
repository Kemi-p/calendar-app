<div class="cal-shell">
  <aside class="cal-sidebar">
    <div class="brand">
      <span class="brand-icon pi pi-calendar-clock"></span>
      <span class="brand-name">Staff Calendar</span>
    </div>
  </aside>

  <main class="cal-main">
    <header class="cal-header">
      <div class="header-left">
        <h1 class="cal-title">
          {{ displayMonth() }} <span></span> <span class="cal-year">{{ displayYear() }}</span>
        </h1>
        <button class="today-btn" (click)="goToToday()">Back to today</button>
      </div>
      <div class="nav-controls">
        <button class="nav-btn" (click)="prev()">‹</button>
        <button class="nav-btn" (click)="next()">›</button>
      </div>
    </header>

    <div class="cal-body">
      <div class="dow-row">
        @for (day of weekDayLabels; track day) {
          <div class="dow-cell" [class.weekend]="day === 'Sat' || day === 'Sun'">
            {{ day }}
          </div>
        }
      </div>

      <div class="month-grid">
        @for (week of weeks(); track $index) {
          @for (day of week; track day.date.toISOString()) {
            <div
              class="day-cell"
              [class.other-month]="!day.isCurrentMonth"
              [class.today]="day.isToday"
              [class.weekend]="day.isWeekend"
              [class.holiday]="day.isHoliday"
              [title]="day.holidayName ?? ''"
            >
              <span class="day-number">{{ formatDay(day.date) }}</span>
              @if (day.isHoliday && day.isCurrentMonth) {
                <span class="holiday-dot" [title]="day.holidayName!"></span>
                <span class="holiday-label">{{ day.holidayName }}</span>
              }
            </div>
          }
        }
      </div>
    </div>
  </main>
</div>
